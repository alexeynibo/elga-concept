<style>
  /* Цвета светлого концепта */
  :root {
    --ink: #f4f6f8;
    --ink-dim: rgba(244, 246, 248, .7);
    --ink-dark: #1d2a33;
    --ink-dark-dim: rgba(29, 42, 51, .6);
    --bg: #0d1013;
    /* поля: 180 px — контейнер контента на 120 px уже, чем в тёмном концепте;
       на экранах шире 1920 контент остаётся шириной 1560 px по центру */
    --side: max(180px, calc((100vw - 1560px) / 2));
  }
  /* логотип и меню — как в тёмном концепте, только тёмные */
  .logo { display: block; line-height: 0; color: inherit; }
  .logo__svg { height: 22px; width: auto; display: block; }
  @media (min-width: 1800px) {
    .logo__svg { height: 29px; }
    .header { font-size: 17px; }
    .menu { gap: 42px; }
  }

  /* Пролог: облака, ели, нырок к разрезу */
  .story { height: 800vh; position: relative; }
  .stage { position: sticky; top: 0; height: 100vh; overflow: hidden; background: #dde3e8; }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .caption--hero { color: var(--ink-dark); max-width: 56%; }

  /* Под облаками — ровная белая заливка: проступает, пока камера проходит сквозь облака */
  .whiteout { position: absolute; inset: 0; z-index: 3; background: #fff; opacity: 0; pointer-events: none; }
  /* Изолинии рельефа (light/maplines.js) — прорисовываются по скроллу, когда облака ушли с экрана */
  .maplines { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
  .maplines path { fill: none; stroke: #ccd2d7; stroke-width: 1.5; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  /* Преимущества: 2×2 слева, на свободном от линий месте. Текст — как у фактоидов тёмного концепта: Golos Text 20 px;
     иконки свои — контур толщиной со штрих текста. Блок приезжает снизу вместе со скроллом и встаёт по центру экрана */
  .perks {
    position: absolute; z-index: 5; left: var(--side); top: 0; width: min(52vw, 860px); will-change: transform;
    display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 56px 48px;
    color: var(--ink-dark); pointer-events: none;
  }
  .perk { display: flex; align-items: center; gap: 24px; }
  .perk__icon { flex: none; width: 56px; height: 56px; }
  .perk__icon path, .perk__icon circle, .perk__icon rect { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }   /* как штрих текста */
  .perk__text { font-size: 20px; line-height: 1.3; letter-spacing: .01em; max-width: 300px; }

  @media (max-width: 760px) {
    .caption--hero { max-width: none; }
    .perks { left: 16px; right: 16px; width: auto; grid-template-columns: 1fr; gap: 28px; }
    .perk__icon { width: 44px; height: 44px; }
    .perk__text { font-size: 15px; }
  }
</style>

<script type="module">
import * as THREE from 'three';

Elga.bind();


const stage = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ antialias: true });
} catch (e) {
  document.getElementById('nogl').style.display = 'flex';
  throw e;
}
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.autoClear = false;
stage.prepend(renderer.domElement);

const SKY = new THREE.Color('#dde3e8');
const FOG = [.867, .89, .91];          // тот же цвет для своих шейдеров
const BELOW = [.4, .44, .47];          // сумрак под облаками и земля за краями фото

// ── Текстура шума: считается один раз, бесшовная, 4 канала с разным рисунком ──
function makeNoiseTexture(size = 256) {
  const data = new Uint8Array(size * size * 4);
  const hash = (x, y, s) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  };
  const vnoise = (x, y, period, s) => {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const m = n => ((n % period) + period) % period;
    const a = hash(m(xi), m(yi), s), b = hash(m(xi + 1), m(yi), s);
    const c = hash(m(xi), m(yi + 1), s), d = hash(m(xi + 1), m(yi + 1), s);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
  for (let ch = 0; ch < 4; ch++) {
    for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) {
      let val = 0, amp = .5, period = 4;
      for (let o = 0; o < 5; o++) {
        val += amp * vnoise(x / size * period, y / size * period, period, ch * 101 + o * 7);
        amp *= .5; period *= 2;
      }
      data[(y * size + x) * 4 + ch] = Math.round(val / .97 * 255);
    }
  }
  const tex = new THREE.DataTexture(data, size, size, THREE.RGBAFormat);
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true;
  return tex;
}
const noiseTex = makeNoiseTexture();

// ── След курсора: две текстуры по очереди, старый след гаснет, новый дорисовывается ──
const orthoCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.PlaneGeometry(2, 2);
const quadVert = `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`;

let trailRT = [];
const trailMat = new THREE.ShaderMaterial({
  uniforms: {
    tPrev: { value: null }, uMouse: { value: new THREE.Vector2(.5, .5) }, uMousePrev: { value: new THREE.Vector2(.5, .5) },
    uAspect: { value: 1 }, uForce: { value: 0 }, uDecay: { value: .96 },
  },
  vertexShader: quadVert,
  fragmentShader: `
    varying vec2 vUv;
    uniform sampler2D tPrev;
    uniform vec2 uMouse, uMousePrev;
    uniform float uAspect, uForce, uDecay;
    float segDist(vec2 p, vec2 a, vec2 b) {
      vec2 pa = p - a, ba = b - a;
      float h = clamp(dot(pa, ba) / max(dot(ba, ba), 1e-6), 0., 1.);
      return length(pa - ba * h);
    }
    void main() {
      float v = texture2D(tPrev, vUv).r * uDecay;
      vec2 asp = vec2(uAspect, 1.);
      float d = segDist(vUv * asp, uMousePrev * asp, uMouse * asp);
      float blob = 1. - smoothstep(0., .3, d);          // крупное мягкое пятно — примерно треть высоты экрана
      v += blob * blob * uForce;
      gl_FragColor = vec4(min(v, 1.), 0., 0., 1.);
    }`,
  depthTest: false, depthWrite: false,
});
const trailScene = new THREE.Scene();
trailScene.add(new THREE.Mesh(quadGeo, trailMat));

// ── 3D-сцена: ели, торчащие из моря облаков ──
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(SKY, 14, 135);
// Небо: сфера вокруг камеры. У горизонта — ровно цвет дымки, поэтому море облаков в него перетекает без линии
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(380, 32, 16),
  new THREE.ShaderMaterial({
    uniforms: {
      uFogColor: { value: new THREE.Vector3(...FOG) }, uTop: { value: new THREE.Vector3(.76, .8, .84) },
      uBelow: { value: new THREE.Vector3(...BELOW) },
    },
    vertexShader: `varying vec3 vDir; void main() { vDir = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
    fragmentShader: `
      uniform vec3 uFogColor, uTop, uBelow;
      varying vec3 vDir;
      void main() {
        vec3 col = mix(uFogColor, uTop, smoothstep(.02, .55, vDir.y));
        col = mix(col, uBelow, smoothstep(0., -.3, vDir.y));   // под облаками сумрачно — белые клубы читаются объёмом
        gl_FragColor = vec4(col, 1.);
      }`,
    side: THREE.BackSide, depthWrite: false,
  })
);
sky.renderOrder = -2;
scene.add(sky);
// Горы на горизонте: панорама зимнего Токинского Становика (assets/mountains-toko.jpg, 4:1) на дуге вокруг камеры —
// как и небо, едут вместе с камерой, поэтому всегда стоят на горизонте. Низ картинки (облака) уходит под море облаков,
// верх растворяется в небе, сами горы чуть тонут в дымке. Когда камера ныряет под облака — гаснут
const mountMat = new THREE.ShaderMaterial({
  uniforms: {
    tMap: { value: new THREE.TextureLoader().load('../assets/mountains-toko.jpg') },
    uFogColor: { value: new THREE.Vector3(...FOG) }, uVis: { value: 1 },
  },
  vertexShader: `varying vec2 vUv; varying float vY; void main() { vUv = uv; vY = position.y; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: `
    uniform sampler2D tMap;
    uniform vec3 uFogColor;
    uniform float uVis;
    varying vec2 vUv;
    varying float vY;
    void main() {
      vec3 col = texture2D(tMap, vUv).rgb;
      col = mix(col, uFogColor, .3);                                         // воздушная перспектива: горы далеко
      float a = smoothstep(1., .82, vUv.y) * smoothstep(0., .25, vUv.y);     // верх — в небо, низ — в облака
      a *= smoothstep(0., .08, vUv.x) * smoothstep(1., .92, vUv.x);          // края дуги
      a *= smoothstep(-3., 11., vY);                                         // подножие долго тает в дымке над морем облаков — без шва
      col = mix(col, uFogColor, smoothstep(10., -1., vY) * .45);            // и ниже светлеет до цвета дымки
      gl_FragColor = vec4(col, a * uVis);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide,           // ели ближе — закрывают горы
});
{
  const R = 300, ARC = THREE.MathUtils.degToRad(150);                      // дуга шире кадра — с запасом на покачивание камеры
  const Hh = R * ARC / 4 * .6;                                             // по пропорции 4:1, но ниже — горы далеко, у самого горизонта
  const geo = new THREE.CylinderGeometry(R, R, Hh, 96, 1, true, Math.PI - ARC / 2, ARC);
  // на уровне глаз — облака под горами, примерно середина картинки: горы целиком поднимаются над морем облаков
  // (центр дуги поднят на долю высоты картинки; больше — горы выше)
  geo.translate(0, Hh * -.01, 0);
  const mountains = new THREE.Mesh(geo, mountMat);
  mountains.scale.x = -1;                                                  // изнутри цилиндра картинка зеркальна — разворачиваем
  mountains.renderOrder = -1.5;
  sky.add(mountains);
}
const camera = new THREE.PerspectiveCamera(38, 1, .1, 400);

// Море облаков: огромная плоскость с шумом. Глубину не пишет — клубы ложатся поверх без резких срезов
const deckMat = new THREE.ShaderMaterial({
  uniforms: {
    tNoise: { value: noiseTex }, uTime: { value: 0 }, uOpacity: { value: 1 },
    uFogColor: { value: new THREE.Vector3(...FOG) },
    uLight: { value: new THREE.Vector3(.965, .972, .978) }, uShadow: { value: new THREE.Vector3(.69, .73, .77) },
  },
  vertexShader: `
    varying vec3 vWorld;
    varying float vDist;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.);
      vWorld = w.xyz;
      vec4 mv = viewMatrix * w;
      vDist = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    uniform sampler2D tNoise;
    uniform float uTime, uOpacity;
    uniform vec3 uFogColor, uLight, uShadow;
    varying vec3 vWorld;
    varying float vDist;
    void main() {
      if (uOpacity <= 0.) discard;
      vec2 p = vWorld.xz;
      float t = uTime;
      float big = texture2D(tNoise, p * .006 + vec2(.0015 * t, 0.)).r;
      float mid = texture2D(tNoise, p * .02 + big * .3 - vec2(.002 * t, 0.)).g;
      float fine = texture2D(tNoise, p * .07 + mid * .2 + vec2(.004 * t)).b;
      float n = big * .5 + mid * .35 + fine * .15;
      vec3 col = mix(uShadow, uLight, smoothstep(.32, .62, n));
      col = mix(col, uFogColor, smoothstep(10., 200., vDist));
      gl_FragColor = vec4(col, uOpacity);
    }`,
  depthWrite: false, transparent: true,
});
const deck = new THREE.Mesh(new THREE.PlaneGeometry(700, 700), deckMat);
deck.rotation.x = -Math.PI / 2;
deck.position.y = -.4;
deck.renderOrder = -1;
scene.add(deck);

// Ветер: ель гнётся целиком — чем выше, тем сильнее (верхушка отклоняется больше), качание медленное
// с порывами; у каждой ели своя фаза (по её месту), поэтому лес качается не в ногу
const WIND_GLSL = `
  uniform float uTime;
  float windGust(vec3 w) {
    vec2 o = modelMatrix[3].xz;                                      // где стоит ель
    float ph = o.x * .37 + o.y * .23;
    return .6 + .4 * sin(uTime * .23 + ph * .5) * sin(uTime * .11 + ph);   // то тише, то сильнее
  }
  vec3 wind(vec3 w) {
    vec2 o = modelMatrix[3].xz;
    float ph = o.x * .37 + o.y * .23;
    float h = max(w.y + 6., 0.) / 16.;                               // доля высоты от основания
    float bend = h * h * windGust(w);
    float sway = .55 + .45 * sin(uTime * .8 + ph) + .18 * sin(uTime * 2.1 + ph * 1.7);
    return vec3(.42, 0., .14) * bend * sway + vec3(0., 0., .08) * bend * sin(uTime * 1.3 + ph * 2.3);
  }`;
// Ель: тонкий ствол и сотни лап. Каждая лапа — две скрещённые плоскости, на которых шейдер рисует ветку
// с хвоей (рваный край, просветы); лапы растут вразброс и кучками, нижние длиннее и свисают, к верхушке — короче.
// Силуэт узкий и неровный, как у таёжной ели. У основания ель растворяется в облаках, вдали — в дымке
const treeMat = new THREE.ShaderMaterial({
  uniforms: {
    uColor: { value: new THREE.Vector3(.15, .2, .2) },
    uTip: { value: new THREE.Vector3(.27, .33, .33) },
    uCloud: { value: new THREE.Vector3(.93, .945, .955) },
    uFogColor: { value: new THREE.Vector3(...FOG) },
    uTime: { value: 0 },
  },
  vertexShader: `
    ${WIND_GLSL}
    attribute vec2 aBranch;                                           // x — доля по лапе (0 у ствола), y — поперёк (−1…1)
    attribute float aShade, aSeed;                                    // затенённость (внутри кроны темнее) и случайное число
    varying vec3 vWorld, vNormal;
    varying vec2 vBranch;
    varying float vShade, vSeed, vDist;
    void main() {
      vec4 w = modelMatrix * vec4(position, 1.);
      w.xyz += wind(w.xyz);

function makeTree(x, z, top, seed) {
  const g = new THREE.Group();
  const base = -6, H = top - base;
  const rnd = n => { const s = Math.sin(seed * 12.9898 + n * 78.233) * 43758.5453; return s - Math.floor(s); };
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.04, .22, H - 1.2, 5), trunkMat);   // ствол прячется под верхушкой
  trunk.position.y = base + (H - 1.2) / 2;
  g.add(trunk);
  const pos = [], nor = [], br = [], shade = [], sd = [], idx = [];
  const up = new THREE.Vector3(0, 1, 0), A = new THREE.Vector3(), S = new THREE.Vector3(), N = new THREE.Vector3();
  const P0 = new THREE.Vector3(), P1 = new THREE.Vector3(), T = new THREE.Vector3();
  let k = 0;
  // одна плоскость лапы: от точки на стволе до кончика, шириной w, развёрнута вокруг оси лапы на угол roll
  const card = (p0, p1, w, roll, sh, s) => {
    A.subVectors(p1, p0).normalize();
    S.crossVectors(A, up).normalize();
    N.crossVectors(S, A).normalize();
    S.multiplyScalar(Math.cos(roll)).addScaledVector(N, Math.sin(roll));
    N.crossVectors(S, A).normalize();
    const c = [[p0, -1, 0], [p0, 1, 0], [p1, -1, 1], [p1, 1, 1]];
    for (const [p, side, u] of c) {
      T.copy(p).addScaledVector(S, side * w * .5);
      pos.push(T.x, T.y, T.z); nor.push(N.x, N.y, N.z);
      br.push(u, side); shade.push(sh); sd.push(s);
    }
    idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3);
    k += 4;
  };
  // лапы — не ровными ярусами, а вразброс по высоте (золотой угол по кругу), разной длины и кучками:
  // так силуэт неровный, с выступами и провалами, как у живой ели
  const count = Math.round(220 + H * 16);
  for (let i = 0; i < count; i++) {
    const f = Math.min(1, (i + rnd(i * 1.3)) / count);                // 0 — низ кроны, 1 — верхушка
    const y = base + H * .16 + f * H * .82;
    const a = i * 2.39996 + (rnd(i * 2.7) - .5) * .8;
    // кучки: длина лапы зависит от плавного «шума» по высоте и направлению
    const clump = .72 + .38 * (.5 + .5 * Math.sin(a * 2. + y * .9 + seed)) * (.5 + .5 * Math.sin(y * 2.3 - a + seed * 3.));
    const R = H * .16 * Math.pow(1 - f, 1.05) + .28;
    const L = R * clump * (.65 + .55 * rnd(i * 5.1));
    // нижние лапы свисают, средние почти горизонтальны, у верхушки смотрят вверх
    const droop = (.42 - .5 * f + (rnd(i * 3.3) - .5) * .2) * L;
    P0.set(Math.cos(a) * .05, y, Math.sin(a) * .05);
    P1.set(Math.cos(a) * L, y - droop, Math.sin(a) * L);
    const w = L * (.5 + .25 * rnd(i * 11.3)) + .1;
    const sh = Math.min(1, .3 + .6 * f + .45 * (L / (R + .01) - .6) + .15 * rnd(i * 17.7));   // короткие (внутренние) лапы в тени
    card(P0, P1, w, (rnd(i * 19.1) - .5) * .6, Math.max(.15, sh), rnd(i * 23.9));
    card(P0, P1, w * .65, 1.2 + (rnd(i * 29.3) - .5) * .5, Math.max(.15, sh * .9), rnd(i * 31.7));
  }
  // верхушка — короткий шпиль из пары плоскостей
  P0.set(0, top - .6, 0); P1.set(0, top + .25, 0);
  card(P0, P1, .22, 0, 1, rnd(99)); card(P0, P1, .22, Math.PI / 2, 1, rnd(98));
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  geo.setAttribute('aBranch', new THREE.Float32BufferAttribute(br, 2));
  geo.setAttribute('aShade', new THREE.Float32BufferAttribute(shade, 1));
  geo.setAttribute('aSeed', new THREE.Float32BufferAttribute(sd, 1));
  geo.setIndex(idx);
  g.add(new THREE.Mesh(geo, treeMat));
  g.position.set(x, 0, z);
  g.rotation.set((rnd(21) - .5) * .03, rnd(22) * Math.PI * 2, (rnd(20) - .5) * .05);
  scene.add(g);
}
// [x, z, высота верхушки над облаками]. Камера стоит на x = 0 и смотрит прямо вперёд.
[
  // перед камерой — только справа: левая половина первого кадра свободна под текст

  [9, -48, 7], [25, -55, 9.2], [12, -68, 8.6], [32, -82, 10.4], [18, -100, 8.2], [44, -110, 9],
  // слева — за краем первого кадра: появляются, когда камера отъезжает

// Облачные «клубы»: плоскости, всегда повёрнутые к камере, размытые шумом.
// Стоят в пространстве — перед елями, между ними и позади, поэтому уходят вдаль вместе со сценой

  // клубы над морем облаков — дают рельеф
  for (let i = 0; i < 300; i++) {
    const z = 52 - r() * 190;

    puffs.push({ x: (r() - .5) * 2 * spread, y: .6 + r() * 2.4, z, sx: 10 + r() * 16, sy: 5 + r() * 6, a: .85 + r() * .15, span: spread });
  }

  for (let i = 0; i < 80; i++) {

    puffs.push({ x: (r() - .5) * 2 * spread, y: 1 + r() * 5.5, z, sx: 4 + r() * 7, sy: 2 + r() * 3, a: .35 + r() * .35, span: spread });

const puffGeo = new THREE.PlaneGeometry(1, 1);

const puffMat = new THREE.ShaderMaterial({

    tNoise: { value: noiseTex }, tTrail: { value: null },

  fragmentShader: `

// Ветер: клубы над морем облаков медленно сносит вправо. Уйдя за край своей полосы, клуб

const WIND = .35;                         // условных метров в секунду

      p.ca = p.a * (1 - sm(.82, 1, Math.abs(p.cx) / p.span));
    }
    tmpV.set(p.cx, p.y, p.z);
    p.d = tmpV.distanceToSquared(camera.position);

  { at: .3,  pos: new THREE.Vector3(0, 9.2, 62),    look: new THREE.Vector3(0, 4.2, -30) },
  { at: .42, pos: new THREE.Vector3(0, 1.5, 54),    look: new THREE.Vector3(0, -30, 14) },
  { at: .52, pos: new THREE.Vector3(0, -30, 42),    look: new THREE.Vector3(0, GROUND_Y, 31) },
  { at: 1,   pos: new THREE.Vector3(0, 0, 31.6),    look: new THREE.Vector3(0, GROUND_Y, 30) },   // высота — по экрану
];
// Финальная высота над разрезом: фото заполняет экран, как фон «cover»
function endHeight() {
  const t = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.min(.92 * MINE_H / t, .92 * MINE_W / (t * camera.aspect));
}
const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const ease = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function placeCamera(p, time) {
  KEYS[4].pos.y = GROUND_Y + endHeight();
  camPos.copy(KEYS[0].pos); camLook.copy(KEYS[0].look);
  for (let i = 1; i < KEYS.length; i++) {
    // отъезд — плавный старт и остановка; дальше нырок одним непрерывным движением
    const k = i === 1 ? ease(sm(KEYS[0].at, KEYS[1].at, p)) : sm(KEYS[i - 1].at, KEYS[i].at, p);
    camPos.lerp(KEYS[i].pos, k);
    camLook.lerp(KEYS[i].look, k);
  }
  // лёгкое «парение» и реакция на мышь — сдвиг камеры вместе с точкой взгляда, без поворота
  const ox = Math.sin(time * .11) * .35 + (smx - .5) * 1.2;
  const oy = Math.sin(time * .17) * .18 + (smy - .5) * .6;
  camPos.x += ox; camLook.x += ox;
  camPos.y += oy; camLook.y += oy;
  camera.position.copy(camPos);
  // когда камера смотрит вниз, «верх» кадра — вперёд по маршруту, иначе кадр заваливается набок
  const down = sm(.42, .52, p);
  camera.up.set(0, 1 - down, -down).normalize();
  camera.lookAt(camLook);
  sky.position.copy(camPos);
}

const capHero = document.getElementById('capHero');
const whiteout = document.getElementById('whiteout');
// преимущества: блок едет вверх вместе со скроллом (один к одному) и встаёт по центру экрана по высоте
const perksBox = document.getElementById('perks');
const PERKS_STOP = .72;                                    // доля пролога, на которой блок встал на место
function movePerks(vh, sy) {
  const stopPx = PERKS_STOP * (story.offsetHeight - vh);
  const y = (vh - perksBox.offsetHeight) / 2 + Math.max(0, stopPx - sy);
  perksBox.style.transform = `translateY(${Math.min(vh * 1.2, y)}px)`;
}
// Изолинии: каждая линия — <path> с длиной, приведённой к 1, поэтому прорисовка — это сдвиг штриха.
// Рисуются справа налево: каждая линия — от своего правого конца, и чем правее линия, тем раньше начинает;
// левые (рядом с текстом) — последними, когда блок с текстом уже встал. При прокрутке назад стираются обратно
const maplines = [];
let linesAuto = 0;                                         // прорисовка линий с учётом дорисовки «самой»
{
  const svg = document.getElementById('maplines'), ns = 'http://www.w3.org/2000/svg';
  let s = 11;
  const r = () => { s = (s * 16807) % 2147483647; return s / 2147483647; };
  (window.ELGA_MAPLINES ? ELGA_MAPLINES.paths : []).forEach(d => {
    const el = document.createElementNS(ns, 'path');
    el.setAttribute('d', d); el.setAttribute('pathLength', '1');
    el.style.strokeDasharray = '1 1'; el.style.strokeDashoffset = '1';
    svg.appendChild(el);
    const n = d.match(/-?\d+(\.\d+)?/g).map(Number);
    const x0 = n[0], x1 = n[n.length - 2];
    const right = Math.max(x0, x1) / ELGA_MAPLINES.width;
    maplines.push({ el, fromEnd: x1 > x0, delay: (1 - right) * .5 + r() * .08, last: -1 });
  });
}
function drawMaplines(t) {                                  // t: 0 — линий нет, 1 — все прорисованы
  for (const m of maplines) {
    const k = Math.min(1, Math.max(0, (t * 1.6 - m.delay) / 1.0));
    // от начала линии — сдвиг 1→0; от конца — −1→0
    const off = Math.round((m.fromEnd ? k - 1 : 1 - k) * 1000) / 1000;
    if (off !== m.last) { m.el.style.strokeDashoffset = off; m.last = off; }
  }
}
const header = document.getElementById('header');
const hint = document.getElementById('hint');
const setLight = on => [header, hint].forEach(el => el.classList.toggle('light', on));

let ping = 0, lastT = 0;
function frame(tms) {
  const time = tms / 1000;
  const dt = Math.min(.25, lastT ? time - lastT : 1 / 60);
  lastT = time;
  prog += (target - prog) * Math.min(1, dt * 5);
  smx += (mx - smx) * Math.min(1, dt * 3); smy += (my - smy) * Math.min(1, dt * 3);
  const p = prog;

  // 1. След курсора
  const src = trailRT[ping], dst = trailRT[1 - ping];
  const speed = Math.hypot(mx - pmx, my - pmy);
  trailMat.uniforms.tPrev.value = src.texture;
  trailMat.uniforms.uMouse.value.set(mx, my);
  trailMat.uniforms.uMousePrev.value.set(pmx, pmy);
  trailMat.uniforms.uForce.value = moved ? Math.min(.3, speed * 10) : 0;
  trailMat.uniforms.uDecay.value = Math.pow(.965, dt * 60);
  renderer.setRenderTarget(dst);
  renderer.render(trailScene, orthoCam);
  pmx = mx; pmy = my;
  ping = 1 - ping;

  // 2. Сцена пролога — рисуем, только пока она на экране
  if (story.getBoundingClientRect().bottom > 0) {
    renderer.setRenderTarget(null);
    renderer.clear();
    placeCamera(p, time);
    updatePuffs(time);
    updateWisps(time);
    wispMat.uniforms.uTime.value = time;
    wispMat.uniforms.tTrail.value = dst.texture;
    wispMat.uniforms.uWind.value = 1 - sm(.3, .44, p);
    puffMat.uniforms.uTime.value = time;
    deckMat.uniforms.uTime.value = time;
    treeMat.uniforms.uTime.value = time;
    puffMat.uniforms.tTrail.value = dst.texture;
    // «пол» облаков растворяется, когда камера к нему подлетает, — дальше видны только клубы
    deckMat.uniforms.uOpacity.value = sm(-.5, 5, camera.position.y);
    mountMat.uniforms.uVis.value = sm(.5, 4, camera.position.y);   // под облаками гор не видно
    renderer.render(scene, camera);
  }

  // 3. Тексты едут вместе с прокруткой, как обычная страница, и уходят за верх экрана.
  // Второй текст поднимается снизу, пока первый ещё на экране
  const vh = window.innerHeight, sy = window.scrollY;
  capHero.style.transform = `translateY(${vh * .3 - sy}px)`;
  whiteout.style.opacity = sm(.45, .53, p);                // сквозь облака — в ровный белый (нырок короткий: ели ушли — сразу облака и белое)
  // облака ушли с экрана — основная часть линий прорисовывается вместе со скроллом; когда она готова,
  // остальное (левый нижний угол) дорисовывается само по времени; прокрутили назад — снова идёт за скроллом
  const lines = sm(.53, .8, p);
  linesAuto = lines >= .62 ? Math.min(1, Math.max(linesAuto, lines) + dt * .45) : lines;
  drawMaplines(linesAuto);
  movePerks(vh, sy);                                       // блок преимуществ приезжает со скроллом

  setLight(false);                       // фон везде светлый — шапка тёмная
  hint.style.opacity = 1 - sm(0, .03, p);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
